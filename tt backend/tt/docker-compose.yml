services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: travel_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_travel_2026
      POSTGRES_DB: travel_emergency_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_emergency_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: travel_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: travel_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/travel-media || true;
      /usr/bin/mc anonymous set download myminio/travel-media || true;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres_travel_2026@postgres:5432/travel_emergency_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres_travel_2026
      DB_NAME: travel_emergency_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: travel-media
      JWT_SECRET: super-secret-travel-emergency-jwt-key-32chars-min
      DESTINATION_AGENT_ENABLED: "true"
      MISSING_THRESHOLD_SECONDS: "5"
      SOS_RADIUS_KM: "20"
      GOOGLE_GEMINI_API_KEY: "${GOOGLE_GEMINI_API_KEY}"
      GOOGLE_PLACES_API_KEY: "${GOOGLE_PLACES_API_KEY}"
      GOOGLE_ROUTES_API_KEY: "${GOOGLE_ROUTES_API_KEY}"

volumes:
  postgres_data:
  redis_data:
  minio_data:
