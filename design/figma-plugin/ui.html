<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        color: #1f2937;
        background: #f7f4ef;
      }
      .wrap { padding: 14px; }
      h1 { font-size: 13px; margin: 0 0 2px; }
      p { margin: 0 0 12px; color: #6b7280; line-height: 1.4; }
      button {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: #14532d;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { background: #9aa39d; cursor: default; }
      #status { margin-top: 10px; min-height: 14px; color: #6b7280; }
      #status.error { color: #dc2626; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>TT App Screens</h1>
      <p>Generates 12 hi-fi frames from the Flutter app in <code>TT/lib</code>.</p>
      <button id="generate">Generate screens</button>
      <div id="status"></div>
    </div>
    <script>
      const btn = document.getElementById("generate");
      const status = document.getElementById("status");

      btn.onclick = () => {
        btn.disabled = true;
        status.className = "";
        status.textContent = "Generating...";
        parent.postMessage({ pluginMessage: { type: "generate" } }, "*");
      };

      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "done") {
          btn.disabled = false;
          status.className = "";
          status.textContent = "Created " + msg.count + " frames on page \u201c" + msg.page + "\u201d.";
        }
        if (msg.type === "error") {
          btn.disabled = false;
          status.className = "error";
          status.textContent = "Error: " + msg.message;
        }
      };
    </script>
  </body>
</html>
